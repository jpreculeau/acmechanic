# Modèle de compose compatible avec la gate de maintenir_service_docker :
# tag piloté par APP_TAG, HEALTHCHECK avec start_interval (sonde rapide
# pendant le démarrage), label de hash de config posé par compose.
services:
  mon-app:
    image: editeur/mon-app:${APP_TAG:-latest}
    container_name: mon-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
