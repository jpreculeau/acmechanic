# Plex — modèle. PLEX_CLAIM (https://plex.tv/claim) dans un .env au
# premier lancement seulement.
services:
  plex:
    image: plexinc/pms-docker:${PLEX_TAG:-latest}
    container_name: plex
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Etc/UTC
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      - ./config:/config
      - ./transcode:/transcode
      - ${MEDIA_DIR:-/chemin/vers/medias}:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:32400/identity || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
