# *arr — modèle (images linuxserver.io). Adaptez PUID/PGID/TZ et les chemins.
x-arr: &arr
  restart: unless-stopped
  environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  prowlarr:
    <<: *arr
    image: linuxserver/prowlarr:${PROWLARR_TAG:-latest}
    container_name: prowlarr
    ports:
      - "9696:9696"
    volumes:
      - ./prowlarr:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9696/ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s

  sonarr:
    <<: *arr
    image: linuxserver/sonarr:${SONARR_TAG:-latest}
    container_name: sonarr
    ports:
      - "8989:8989"
    volumes:
      - ./sonarr:/config
      - ${MEDIA_DIR:-/chemin/vers/medias}:/data/media
      - ${DOWNLOADS_DIR:-/chemin/vers/telechargements}:/data/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s

  radarr:
    <<: *arr
    image: linuxserver/radarr:${RADARR_TAG:-latest}
    container_name: radarr
    ports:
      - "7878:7878"
    volumes:
      - ./radarr:/config
      - ${MEDIA_DIR:-/chemin/vers/medias}:/data/media
      - ${DOWNLOADS_DIR:-/chemin/vers/telechargements}:/data/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7878/ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s

