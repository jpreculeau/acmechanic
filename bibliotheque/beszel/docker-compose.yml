# Beszel — modèle (hub + agent). La clé publique KEY de l'agent se
# récupère dans le hub (« Ajouter un système ») : à mettre dans un fichier
# .env à côté de ce compose, jamais en clair dans un dépôt.
services:
  beszel:
    image: henrygd/beszel:${BESZEL_TAG:-latest}
    container_name: beszel
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./beszel_data:/beszel_data
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  beszel-agent:
    image: henrygd/beszel-agent:${BESZEL_AGENT_TAG:-latest}
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./beszel_agent_data:/var/lib/beszel-agent
    environment:
      PORT: 45876
      KEY: ${BESZEL_AGENT_KEY:?definir BESZEL_AGENT_KEY dans .env}
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
