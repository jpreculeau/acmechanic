# Forgejo — modèle. Image hébergée sur Codeberg (pas Docker Hub) :
# Acmechanic tire l'image à chaque passage et ne recrée le conteneur
# que si elle a changé. Suivez une version majeure (FORGEJO_CANAL=11) :
# les montées de majeure se font à la main, après lecture des notes.
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:${FORGEJO_TAG:-11}
    container_name: forgejo
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/healthz || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
