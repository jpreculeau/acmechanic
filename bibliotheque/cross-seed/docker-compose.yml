# cross-seed — modèle.
# « name » explicite : deux fichiers compose dans un MÊME dossier partagent
# sinon le même projet, et le `up --remove-orphans` de l'un supprime les
# conteneurs de l'autre (considérés orphelins).
name: cross-seed

services:
  cross-seed:
    image: crossseed/cross-seed:${CROSS_SEED_TAG:-latest}
    container_name: cross-seed
    restart: unless-stopped
    command: ["daemon"]
    ports:
      - "127.0.0.1:2468:2468"
    volumes:
      - ./config:/config
      - ${DOWNLOADS_DIR:-/chemin/vers/telechargements}:/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:2468/api/ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
