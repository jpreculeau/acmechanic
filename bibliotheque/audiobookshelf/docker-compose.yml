# Audiobookshelf — modèle.
services:
  audiobookshelf:
    image: advplyr/audiobookshelf:${AUDIOBOOKSHELF_TAG:-latest}
    container_name: audiobookshelf
    restart: unless-stopped
    ports:
      - "13378:80"
    volumes:
      - ./config:/config
      - ./metadata:/metadata
      - ${AUDIOBOOKS_DIR:-/chemin/vers/livres-audio}:/audiobooks
      - ${PODCASTS_DIR:-/chemin/vers/podcasts}:/podcasts
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/healthcheck || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
