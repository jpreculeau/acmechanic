# Jellyfin — modèle. Transcodage matériel : décommentez devices/group_add.
services:
  jellyfin:
    image: jellyfin/jellyfin:${JELLYFIN_TAG:-latest}
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ${MEDIA_DIR:-/chemin/vers/medias}:/media:ro
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "992"   # GID du groupe render (getent group render)
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
