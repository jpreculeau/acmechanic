# Syncthing — modèle. network_mode host : découverte locale et ports sync.
services:
  syncthing:
    image: syncthing/syncthing:${SYNCTHING_TAG:-latest}
    container_name: syncthing
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - STHOMEDIR=/var/syncthing/config
    volumes:
      - ./config:/var/syncthing/config
      - ${SYNC_DIR:-/chemin/vers/partages}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8384/rest/noauth/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
